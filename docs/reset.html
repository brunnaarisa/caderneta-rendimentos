<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Atualizando Radar...</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:system-ui;background:#0a1628;color:#fff;text-align:center}
.box{padding:2rem}
h2{font-size:1.3rem;margin-bottom:.5rem}
p{color:#8899aa;font-size:.9rem}
.spinner{width:40px;height:40px;border:4px solid #223;border-top-color:#4fc3f7;border-radius:50%;animation:spin 1s linear infinite;margin:1.5rem auto}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head><body>
<div class="box">
<div class="spinner"></div>
<h2>Atualizando o Radar...</h2>
<p>Limpando cache e dados antigos.</p>
<p id="status">Aguarde...</p>
</div>
<script>
(async function(){
  var el = document.getElementById('status');
  try {
    // 1. Remove signal tracker antigo
    localStorage.removeItem('radar_signal_tracker');
    localStorage.removeItem('_radar_ver');
    el.textContent = 'Limpando caches...';

    // 2. Limpa todos os caches
    if ('caches' in window) {
      var names = await caches.keys();
      for (var i = 0; i < names.length; i++) {
        await caches.delete(names[i]);
      }
    }

    // 3. Desregistra todos os Service Workers
    if ('serviceWorker' in navigator) {
      var regs = await navigator.serviceWorker.getRegistrations();
      for (var i = 0; i < regs.length; i++) {
        await regs[i].unregister();
      }
    }

    el.textContent = 'Redirecionando...';

    // 4. Redireciona com cache-buster na URL
    setTimeout(function(){
      window.location.replace('./index.html?_reset=' + Date.now());
    }, 500);

  } catch(e) {
    el.textContent = 'Erro: ' + e.message + '. Tente recarregar.';
  }
})();
</script>
</body></html>
